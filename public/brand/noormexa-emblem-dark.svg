<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <!-- 3D Sphere Base Gradient for Dark Mode -->
    <radialGradient id="em_dark_sphere_bg_grad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1976D2" />
      <stop offset="35%" stop-color="#0D47A1" />
      <stop offset="70%" stop-color="#082A66" />
      <stop offset="90%" stop-color="#031433" />
      <stop offset="100%" stop-color="#010A1A" />
    </radialGradient>

    <!-- Outer Rim Glow -->
    <linearGradient id="em_dark_sphere_rim_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#2563EB" stop-opacity="0.4" />
      <stop offset="75%" stop-color="#FBBF24" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0.95" />
    </linearGradient>

    <!-- N - Left Pillar Blue Gradient -->
    <linearGradient id="em_dark_n_left_pillar_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="30%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F2F7D" />
    </linearGradient>

    <!-- N - Diagonal Stroke Gold Gradient -->
    <linearGradient id="em_dark_n_diag_gold_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5" />
      <stop offset="20%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- N - Right Pillar Gold Gradient -->
    <linearGradient id="em_dark_n_right_pillar_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#FBBF24" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Drop Shadow for 3D Layer Overlap -->
    <filter id="em_dark_n_3d_shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Soft Luminous Glow Under Sphere -->
    <filter id="em_dark_sphere_outer_shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.5" />
    </filter>

    <!-- Sphere Clip -->
    <clipPath id="em_dark_sphere_circle_clip">
      <circle cx="80" cy="80" r="58" />
    </clipPath>
  </defs>

  <g id="noormexa-emblem-dark-svg" filter="url(#em_dark_sphere_outer_shadow)">
    <circle cx="80" cy="80" r="58" fill="url(#em_dark_sphere_bg_grad)" />

    <g clip-path="url(#em_dark_sphere_circle_clip)">
      <path d="M 22,80 C 45,68 115,68 138,80" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.2" stroke-dasharray="3 3" fill="none" />
      <path d="M 27,54 C 50,42 110,42 133,54" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2" fill="none" />
      <path d="M 27,106 C 50,118 110,118 133,106" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2" fill="none" />

      <path d="M 80,22 C 60,50 60,110 80,138" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.2" fill="none" />
      <path d="M 80,22 C 100,50 100,110 80,138" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.2" fill="none" />

      <circle cx="48" cy="54" r="2.8" fill="#93C5FD" fill-opacity="0.95" />
      <circle cx="112" cy="106" r="2.8" fill="#FDE68A" fill-opacity="0.95" />
      <circle cx="34" cy="80" r="2.2" fill="#FFFFFF" fill-opacity="0.7" />
      <circle cx="126" cy="80" r="2.2" fill="#FFFFFF" fill-opacity="0.7" />

      <!-- Left Pillar -->
      <path
        d="M 37,42 
           C 47,38 53,44 53,52 
           L 53,108 
           C 53,118 45,124 37,120 
           C 31,108 28,94 28,80 
           C 28,66 31,52 37,42 Z"
        fill="url(#em_dark_n_left_pillar_grad)"
      />
      <path
        d="M 37,42 C 31,53 28,66 28,80 C 28,94 31,107 37,120"
        stroke="#BFDBFE"
        stroke-width="2"
        stroke-linecap="round"
        fill="none"
      />

      <!-- Right Pillar -->
      <path
        d="M 123,42 
           C 129,52 132,66 132,80 
           C 132,94 129,108 123,118 
           C 115,122 107,116 107,108 
           L 107,52 
           C 107,44 113,38 123,42 Z"
        fill="url(#em_dark_n_right_pillar_grad)"
      />
      <path
        d="M 123,42 C 129,52 132,66 132,80 C 132,94 129,108 123,118"
        stroke="#FEF08A"
        stroke-width="2"
        stroke-linecap="round"
        fill="none"
      />

      <!-- Central 3D Diagonal Ribbon -->
      <path
        d="M 36,36 
           C 44,32 54,34 60,42 
           L 124,118 
           C 128,124 124,132 116,132 
           C 108,132 100,126 94,118 
           L 38,48 
           C 33,42 32,38 36,36 Z"
        fill="url(#em_dark_n_diag_gold_grad)"
        filter="url(#em_dark_n_3d_shadow)"
      />

      <!-- Sheen Line -->
      <path
        d="M 40,37 L 120,121"
        stroke="#FFFFFF"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-opacity="0.9"
        fill="none"
      />

      <circle cx="45" cy="45" r="3.8" fill="#FFFFFF" fill-opacity="1" />
      <circle cx="115" cy="115" r="3.8" fill="#FFFBEB" fill-opacity="1" />

      <ellipse cx="62" cy="50" rx="28" ry="16" transform="rotate(-30 62 50)" fill="#FFFFFF" fill-opacity="0.18" />
    </g>

    <circle cx="80" cy="80" r="58" stroke="url(#em_dark_sphere_rim_grad)" stroke-width="2" fill="none" />
  </g>
</svg>
