    <!-- Right 4 Vertical Bars (Caps rx=4) -->
    <rect x="128" y="14" width="8" height="172" rx="4" />
    <rect x="144" y="14" width="8" height="172" rx="4" />
    <rect x="160" y="14" width="8" height="172" rx="4" />
    <rect x="176" y="14" width="8" height="172" rx="4" />
  </g>
</svg>