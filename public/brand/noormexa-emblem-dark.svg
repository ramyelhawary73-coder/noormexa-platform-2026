<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <g id="noormexa-emblem" fill="#ffffff">
    <!-- Left 4 Vertical Bars (Caps rx=4) -->
    <rect x="16" y="14" width="8" height="172" rx="4" />
    <rect x="32" y="14" width="8" height="172" rx="4" />
    <rect x="48" y="14" width="8" height="172" rx="4" />
    <rect x="64" y="14" width="8" height="172" rx="4" />

    <!-- Center Point-Symmetric Diagonal Parallelogram ('N' Slash) -->
