<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" fill="none" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Luxury Linear Gold Gradient -->
    <linearGradient id="nmx-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B88438" />
      <stop offset="45%" stop-color="#A6742E" />
      <stop offset="100%" stop-color="#8F6023" />
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="nmx-gold-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6A4A1C" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Geometric Luxury 'N' Monogram -->
  <g id="noormexa-monogram" transform="translate(30, 20)">
    
    <!-- 
      Monogram Grid:
      Left column: X = 135 to 195 (Width = 60, Stroke = 20)
        - Outer line: X = 135 (from Y = 80 to 380)
        - Bottom bar: Y = 380 (from X = 135 to 195)
        - Inner line: X = 195 (from Y = 160 to 380)
      
      Right column: X = 345 to 405 (Width = 60, Stroke = 20)
        - Outer line: X = 405 (from Y = 80 to 380)
        - Top bar: Y = 80 (from X = 345 to 405)
        - Inner line: X = 345 (from Y = 80 to 300)

      Center Diagonals:
        - Diagonal 1 (Upper): from (X: 195, Y: 80) down to (X: 345, Y: 280)
        - Diagonal 2 (Lower): from (X: 195, Y: 180) down to (X: 345, Y: 380)
    -->

    <!-- Left Outer Vertical Bar -->
    <rect x="135" y="80" width="20" height="300" rx="1" fill="url(#nmx-gold-grad)" filter="url(#nmx-gold-shadow)" />

    <!-- Left Bottom Horizontal Connector -->
    <rect x="135" y="360" width="60" height="20" rx="1" fill="url(#nmx-gold-grad)" />

    <!-- Left Inner Vertical Bar -->
    <rect x="175" y="150" width="20" height="230" rx="1" fill="url(#nmx-gold-grad)" />

    <!-- Upper Main Diagonal Bar (Slope: 45°) -->
    <polygon 
      points="175,80 195,80 345,280 345,307 325,307 175,107" 
      fill="url(#nmx-gold-grad)" 
      filter="url(#nmx-gold-shadow)"
    />

    <!-- Lower Secondary Diagonal Bar -->
    <polygon 
      points="175,153 195,153 345,353 345,380 325,380 175,180" 
      fill="url(#nmx-gold-grad)" 
      filter="url(#nmx-gold-shadow)"
    />

    <!-- Right Inner Vertical Bar -->
    <rect x="345" y="80" width="20" height="230" rx="1" fill="url(#nmx-gold-grad)" />

    <!-- Right Top Horizontal Connector -->
    <rect x="345" y="80" width="60" height="20" rx="1" fill="url(#nmx-gold-grad)" />

    <!-- Right Outer Vertical Bar -->
    <rect x="385" y="80" width="20" height="300" rx="1" fill="url(#nmx-gold-grad)" filter="url(#nmx-gold-shadow)" />

  </g>

  <!-- Master NOORMEXA Wordmark in Luxury Gold -->
  <text 
    x="300" 
    y="490" 
    text-anchor="middle" 
    fill="#A6742E" 
    font-family="system-ui, -apple-system, 'Montserrat', 'Inter', 'Segoe UI', Arial, sans-serif" 
    font-size="46" 
    font-weight="900" 
    letter-spacing="11px"
  >NOORMEXA</text>
</svg>