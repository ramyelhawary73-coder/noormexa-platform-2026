<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" fill="none" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="nmx_light_front_left" x1="20%" y1="0%" x2="90%" y2="100%">
        <stop offset="0%" stop-color="#020617" />
        <stop offset="55%" stop-color="#0F172A" />
        <stop offset="100%" stop-color="#1E293B" />
      </linearGradient>
      <linearGradient id="nmx_light_front_right" x1="10%" y1="100%" x2="90%" y2="0%">
        <stop offset="0%" stop-color="#020617" />
        <stop offset="60%" stop-color="#0F172A" />
        <stop offset="100%" stop-color="#1E293B" />
      </linearGradient>
    <linearGradient id="nmx_light_shadow_left" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#334155" />
        <stop offset="40%" stop-color="#64748B" />
        <stop offset="80%" stop-color="#94A3B8" />
        <stop offset="100%" stop-color="#CBD5E1" />
      </linearGradient>
    <linearGradient id="nmx_light_shadow_right" x1="10%" y1="0%" x2="90%" y2="100%">
        <stop offset="0%" stop-color="#020617" />
        <stop offset="30%" stop-color="#1E293B" />
        <stop offset="70%" stop-color="#475569" />
        <stop offset="100%" stop-color="#94A3B8" />
      </linearGradient>
    <filter id="nmx_light_drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Sculpted 3D Ribbon 'N' -->
  <g id="noormexa-ribbon-symbol" transform="translate(50, 25)">
    
    <!-- 1. Left Blade: Inner Dark Gradient Under-Fold -->
    <path 
      d="M 268 95 
         C 235 125 195 210 240 330 
         C 228 335 214 340 196 345 
         C 165 240 220 120 268 95 Z" 
      fill="url(#nmx_light_shadow_left)" 
    />

    <!-- 2. Left Blade: Outer Front Light Face -->
    <path 
      d="M 196 345 
         L 196 175 
         C 196 115 228 95 268 95 
         C 230 135 205 225 240 330 
         C 225 338 210 342 196 345 Z" 
      fill="url(#nmx_light_front_left)" 
      filter="url(#nmx_light_drop)"
    />

    <!-- 3. Right Blade: Deep Shaded Crease / Inner Underside -->
    <path 
      d="M 268 95 
         C 292 95 316 115 316 175 
         L 316 270 
         C 316 310 290 345 252 345 
         C 290 290 282 165 268 95 Z" 
      fill="url(#nmx_light_shadow_right)" 
    />

    <!-- 4. Right Blade: Front Light Surface / Sweeping Wing -->
    <path 
      d="M 252 345 
         C 246 320 258 235 285 170 
         C 296 142 306 120 316 108 
         C 316 148 316 230 316 270 
         C 316 312 288 345 252 345 Z" 
      fill="url(#nmx_light_front_right)" 
      filter="url(#nmx_light_drop)"
    />

  </g>

  
</svg>