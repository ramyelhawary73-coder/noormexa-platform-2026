<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="nmx-gold-emblem-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B88438" />
      <stop offset="45%" stop-color="#A6742E" />
      <stop offset="100%" stop-color="#8F6023" />
    </linearGradient>
    <filter id="nmx-emblem-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6A4A1C" flood-opacity="0.15" />
    </filter>
  </defs>

  <g id="noormexa-emblem-symbol" transform="translate(-70, -30)">
    <!-- Left Outer Vertical Bar -->
    <rect x="135" y="80" width="20" height="300" rx="1" fill="url(#nmx-gold-emblem-grad)" filter="url(#nmx-emblem-shadow)" />

    <!-- Left Bottom Horizontal Connector -->
    <rect x="135" y="360" width="60" height="20" rx="1" fill="url(#nmx-gold-emblem-grad)" />

    <!-- Left Inner Vertical Bar -->
    <rect x="175" y="150" width="20" height="230" rx="1" fill="url(#nmx-gold-emblem-grad)" />

    <!-- Upper Main Diagonal Bar -->
    <polygon 
      points="175,80 195,80 345,280 345,307 325,307 175,107" 
      fill="url(#nmx-gold-emblem-grad)" 
      filter="url(#nmx-emblem-shadow)"
    />

    <!-- Lower Secondary Diagonal Bar -->
    <polygon 
      points="175,153 195,153 345,353 345,380 325,380 175,180" 
      fill="url(#nmx-gold-emblem-grad)" 
      filter="url(#nmx-emblem-shadow)"
    />

    <!-- Right Inner Vertical Bar -->
    <rect x="345" y="80" width="20" height="230" rx="1" fill="url(#nmx-gold-emblem-grad)" />

    <!-- Right Top Horizontal Connector -->
    <rect x="345" y="80" width="60" height="20" rx="1" fill="url(#nmx-gold-emblem-grad)" />

    <!-- Right Outer Vertical Bar -->
    <rect x="385" y="80" width="20" height="300" rx="1" fill="url(#nmx-gold-emblem-grad)" filter="url(#nmx-emblem-shadow)" />
  </g>
</svg>