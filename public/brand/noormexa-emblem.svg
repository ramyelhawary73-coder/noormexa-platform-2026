<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="em_globe_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DBEAFE" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#EFF6FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="em_n_left_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <linearGradient id="em_n_diagonal_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="25%" stop-color="#FBBF24" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="em_n_right_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="em_orbit_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#D97706" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="em_orbit_cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="em_orbit_meridian" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0.1" />
    </linearGradient>

    <filter id="em_node_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="em_ribbon_shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-2" dy="3.5" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
  </defs>

  <g id="noormexa-emblem-svg">
    <circle cx="80" cy="80" r="62" fill="url(#em_globe_glow)" />

    <!-- Background Threads -->
    <circle cx="80" cy="80" r="56" stroke="#0284C7" stroke-width="1.2" stroke-dasharray="4 3" stroke-opacity="0.3" />
    <path d="M 80,24 C 44,24 38,80 38,80 C 38,80 44,136 80,136" stroke="url(#em_orbit_cyan)" stroke-width="1.4" stroke-opacity="0.35" stroke-dasharray="5 3" fill="none" />
    <path d="M 80,24 C 116,24 122,80 122,80 C 122,80 116,136 80,136" stroke="url(#em_orbit_meridian)" stroke-width="1.4" stroke-opacity="0.35" stroke-dasharray="5 3" fill="none" />
    <path d="M 36,52 C 55,40 105,40 124,52" stroke="#60A5FA" stroke-width="1.2" stroke-opacity="0.25" fill="none" />
    <path d="M 36,108 C 55,120 105,120 124,108" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.25" fill="none" />

    <!-- Core N -->
    <path
      d="M 38,34 
         C 47,34 52,39 52,47 
         L 52,113 
         C 52,121 47,126 38,126 
         C 34,126 31,120 31,113 
         L 31,47 
         C 31,40 34,34 38,34 Z"
      fill="url(#em_n_left_grad)"
    />
    <path d="M 34,44 L 34,116" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6" fill="none" />

    <path
      d="M 122,34 
         C 126,34 129,40 129,47 
         L 129,113 
         C 129,120 126,126 122,126 
         C 113,126 108,121 108,113 
         L 108,47 
         C 108,39 113,34 122,34 Z"
      fill="url(#em_n_right_grad)"
    />
    <path d="M 126,44 L 126,116" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6" fill="none" />

    <path
      d="M 33,36 
         C 41,32 50,35 56,43 
         L 126,116 
         C 130,121 127,128 120,128 
         C 112,128 104,123 98,115 
         L 32,47 
         C 28,42 28,38 33,36 Z"
      fill="url(#em_n_diagonal_grad)"
      filter="url(#em_ribbon_shadow)"
    />
    <path d="M 37,38 L 121,123" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.85" fill="none" />
    <path d="M 44,48 L 110,117" stroke="#FEF08A" stroke-width="1" stroke-dasharray="6 4" stroke-opacity="0.9" fill="none" />

    <!-- Foreground Threads -->
    <path
      d="M 18,92 
         C 25,62 70,55 105,68 
         C 128,77 142,92 142,96 
         C 142,102 120,116 85,114 
         C 50,112 20,98 18,92 Z"
      stroke="url(#em_orbit_gold)"
      stroke-width="2.2"
      fill="none"
    />
    <path
      d="M 28,118 
         C 32,100 68,60 110,44 
         C 134,35 146,42 146,48 
         C 146,56 122,86 82,110 
         C 54,126 30,126 28,118 Z"
      stroke="url(#em_orbit_cyan)"
      stroke-width="1.8"
      stroke-dasharray="6 3"
      fill="none"
    />
    <path d="M 24,80 C 45,74 115,74 136,80" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.3" fill="none" />

    <!-- Nodes -->
    <circle cx="38" cy="38" r="4.5" fill="#38BDF8" filter="url(#em_node_glow)" />
    <circle cx="38" cy="38" r="2.2" fill="#FFFFFF" />
    <circle cx="124" cy="74" r="3.5" fill="#FBBF24" filter="url(#em_node_glow)" />
    <circle cx="124" cy="74" r="1.8" fill="#FFFFFF" />
    <circle cx="122" cy="122" r="4.5" fill="#F59E0B" filter="url(#em_node_glow)" />
    <circle cx="122" cy="122" r="2.2" fill="#FFFFFF" />
    <circle cx="28" cy="94" r="2.5" fill="#38BDF8" />
    <circle cx="28" cy="94" r="1.2" fill="#FFFFFF" />
    <circle cx="110" cy="44" r="2.8" fill="#FDE047" />
    <circle cx="110" cy="44" r="1.4" fill="#FFFFFF" />
    <circle cx="80" cy="80" r="3" fill="#FFFFFF" filter="url(#em_node_glow)" />
  </g>
</svg>
