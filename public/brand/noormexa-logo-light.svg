<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="100%" height="100%" fill="none">
  <defs>
    <!-- 3D Globe Realistic Sphere Gradient (Light Mode) -->
    <radialGradient id="lg_globe_sphere" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#3B82F6" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#1E40AF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#172554" stop-opacity="1" />
    </radialGradient>

    <!-- Globe Outer Rim Glow -->
    <radialGradient id="lg_globe_rim" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#60A5FA" stop-opacity="0" />
      <stop offset="96%" stop-color="#0284C7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8" />
    </radialGradient>

    <!-- Top-Left Sunlight Specular Highlight -->
    <radialGradient id="lg_sun_highlight" cx="32%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="45%" stop-color="#93C5FD" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>

    <!-- N - Left Pillar Gradient (Electric Blue Sapphire) -->
    <linearGradient id="lg_n_left_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="25%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- N - Diagonal Ribbon Gradient (Radiant Imperial Gold) -->
    <linearGradient id="lg_n_diagonal_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="20%" stop-color="#FDE047" />
      <stop offset="55%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- N - Right Pillar Gradient (Deep Indigo Cobalt) -->
    <linearGradient id="lg_n_right_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="30%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- 3D Orbit Ring Gradient -->
    <linearGradient id="lg_orbit_ring_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#F59E0B" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.3" />
    </linearGradient>

    <!-- Typography Gradient -->
    <linearGradient id="lg_brand_text_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Filter: Node Glow -->
    <filter id="lg_node_glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Filter: 3D Ribbon Drop Shadow -->
    <filter id="lg_ribbon_shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-2.5" dy="4" stdDeviation="3.5" flood-color="#020617" flood-opacity="0.5" />
    </filter>

    <!-- Filter: Globe Depth Shadow -->
    <filter id="lg_globe_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ================= EMBLEM ================= -->
  <g id="noormexa-3d-globe-emblem" transform="translate(0, 0)">
    <!-- 1. 3D Globe Base -->
    <g filter="url(#lg_globe_shadow)">
      <circle cx="90" cy="90" r="66" fill="url(#lg_globe_sphere)" />
      <circle cx="90" cy="90" r="66" fill="url(#lg_globe_rim)" />
      <circle cx="90" cy="90" r="66" fill="url(#lg_sun_highlight)" />
    </g>

    <!-- 2. Globe Gridlines & Continents -->
    <ellipse cx="90" cy="90" rx="66" ry="17" stroke="#60A5FA" stroke-width="1.2" stroke-opacity="0.5" fill="none" />
    <ellipse cx="90" cy="62" rx="58" ry="13" stroke="#93C5FD" stroke-width="1" stroke-dasharray="4 3" stroke-opacity="0.4" fill="none" />
    <ellipse cx="90" cy="118" rx="58" ry="13" stroke="#FBBF24" stroke-width="1" stroke-dasharray="4 3" stroke-opacity="0.4" fill="none" />
    <ellipse cx="90" cy="90" rx="22" ry="66" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.45" fill="none" />
    <path d="M 90,24 C 54,24 46,90 46,90 C 46,90 54,156 90,156" stroke="#67E8F9" stroke-width="1" stroke-dasharray="5 3" stroke-opacity="0.35" fill="none" />
    <path d="M 90,24 C 126,24 134,90 134,90 C 134,90 126,156 90,156" stroke="#60A5FA" stroke-width="1" stroke-dasharray="5 3" stroke-opacity="0.35" fill="none" />

    <!-- Trade Landmass Silhouettes -->
    <path d="M 68,54 Q 76,46 88,48 Q 98,42 110,48 Q 116,56 108,66 Q 96,68 84,62 Z" fill="#38BDF8" fill-opacity="0.25" />
    <path d="M 72,96 Q 84,94 92,102 Q 90,118 78,124 Q 70,116 72,96 Z" fill="#F59E0B" fill-opacity="0.22" />

    <!-- 3. Core Letter 'N' -->
    <!-- [Left Pillar] -->
    <path
      d="M 44,38 
         C 53,38 58,43 58,52 
         L 58,128 
         C 58,137 53,142 44,142 
         C 39,142 35,136 35,128 
         L 35,52 
         C 35,44 39,38 44,38 Z"
      fill="url(#lg_n_left_grad)"
    />
    <path d="M 39,48 L 39,132" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.75" fill="none" />

    <!-- [Right Pillar] -->
    <path
      d="M 136,38 
         C 141,38 145,44 145,52 
         L 145,128 
         C 145,136 141,142 136,142 
         C 127,142 122,137 122,128 
         L 122,52 
         C 122,43 127,38 136,38 Z"
      fill="url(#lg_n_right_grad)"
    />
    <path d="M 141,48 L 141,132" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.75" fill="none" />

    <!-- [Diagonal Gold Ribbon] -->
    <path
      d="M 37,40 
         C 47,35 57,39 64,48 
         L 142,132 
         C 147,138 143,145 135,145 
         C 125,145 117,140 109,130 
         L 36,52 
         C 32,46 32,42 37,40 Z"
      fill="url(#lg_n_diagonal_grad)"
      filter="url(#lg_ribbon_shadow)"
    />
    <path d="M 42,43 L 137,139" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-opacity="0.9" fill="none" />
    <path d="M 50,54 L 126,133" stroke="#FEF08A" stroke-width="1.2" stroke-dasharray="8 5" stroke-opacity="0.95" fill="none" />

    <!-- 4. 3D Orbit Belt -->
    <path
      d="M 16,108 
         C 24,72 74,60 118,74 
         C 148,84 166,102 164,110 
         C 162,118 136,134 94,130 
         C 52,126 18,116 16,108 Z"
      stroke="url(#lg_orbit_ring_grad)"
      stroke-width="2.6"
      fill="none"
    />
    <path
      d="M 28,136 
         C 32,114 74,68 122,50 
         C 150,40 164,48 164,56 
         C 164,66 136,100 90,126 
         C 58,144 30,144 28,136 Z"
      stroke="#38BDF8"
      stroke-width="1.8"
      stroke-dasharray="7 4"
      stroke-opacity="0.75"
      fill="none"
    />

    <!-- 5. Luminous Nodes -->
    <circle cx="44" cy="44" r="5" fill="#38BDF8" filter="url(#lg_node_glow)" />
    <circle cx="44" cy="44" r="2.5" fill="#FFFFFF" />
    <circle cx="136" cy="136" r="5" fill="#F59E0B" filter="url(#lg_node_glow)" />
    <circle cx="136" cy="136" r="2.5" fill="#FFFFFF" />
    <circle cx="140" cy="84" r="4" fill="#FBBF24" filter="url(#lg_node_glow)" />
    <circle cx="140" cy="84" r="2" fill="#FFFFFF" />
    <circle cx="26" cy="108" r="3.5" fill="#67E8F9" />
    <circle cx="26" cy="108" r="1.6" fill="#FFFFFF" />
    <circle cx="122" cy="50" r="3.5" fill="#FDE047" />
    <circle cx="122" cy="50" r="1.6" fill="#FFFFFF" />
    <circle cx="90" cy="90" r="3.8" fill="#FFFFFF" filter="url(#lg_node_glow)" />
  </g>

  <!-- ================= TYPOGRAPHY & ARABIC SLOGAN ================= -->
  <g id="noormexa-wordmark" transform="translate(180, 0)">
    <text
      x="0"
      y="92"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Roboto, sans-serif"
      font-size="58"
      font-weight="900"
      letter-spacing="2.5px"
      fill="url(#lg_brand_text_grad)"
    >
      NOORMEXA
    </text>
    <text
      x="2"
      y="130"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Cairo', 'Segoe UI', Tahoma, sans-serif"
      font-size="18"
      font-weight="700"
      fill="#D97706"
    >
      سوق التجارة والتسوق العالمي الذكي
    </text>
  </g>
</svg>
