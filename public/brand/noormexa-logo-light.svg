<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="1080" height="320" fill="none" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Primary Champagne Gold Ribbon Gradient -->
    <linearGradient id="nmx_full_gold_l" x1="20%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ECD697" />
      <stop offset="30%" stop-color="#DFBF6D" />
      <stop offset="60%" stop-color="#C49B45" />
      <stop offset="85%" stop-color="#A37A2C" />
      <stop offset="100%" stop-color="#7E5818" />
    </linearGradient>

    <!-- Gold Arc & Nodes Gradient -->
    <linearGradient id="nmx_full_gold_arc_l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED9A0" />
      <stop offset="50%" stop-color="#C6A04D" />
      <stop offset="100%" stop-color="#967026" />
    </linearGradient>

    <!-- Ocean Teal Primary Ribbon Gradient -->
    <linearGradient id="nmx_full_teal_l" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#25BFD2" />
      <stop offset="30%" stop-color="#1592A5" />
      <stop offset="65%" stop-color="#0A5E70" />
      <stop offset="90%" stop-color="#043846" />
      <stop offset="100%" stop-color="#011F28" />
    </linearGradient>

    <!-- Teal Right Pillar Gradient -->
    <linearGradient id="nmx_full_teal_pillar_l" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#22BACD" />
      <stop offset="40%" stop-color="#118397" />
      <stop offset="80%" stop-color="#074B5C" />
      <stop offset="100%" stop-color="#032D38" />
    </linearGradient>

    <!-- Teal Outer Arc Gradient -->
    <linearGradient id="nmx_full_teal_arc_l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1CA0B3" />
      <stop offset="60%" stop-color="#095465" />
      <stop offset="100%" stop-color="#022731" />
    </linearGradient>
  </defs>

  <!-- 1. Emblem (x: 12, y: 15, scale: 0.65 to fit 130x130) -->
  <g transform="translate(12, 15) scale(0.65)">
    <!-- Outer Right Gold Globe Arc -->
    <path d="M 100,14 C 146,14 186,52 186,100 C 186,128 174,152 154,168" stroke="url(#nmx_full_gold_arc_l)" stroke-width="7" stroke-linecap="round" opacity="0.9" />
    <!-- Upper-Right Gold Meridian Loop -->
    <path d="M 100,14 C 128,14 154,50 154,96 C 154,120 144,146 126,166" stroke="url(#nmx_full_gold_arc_l)" stroke-width="5.5" stroke-linecap="round" opacity="0.8" />
    <!-- Horizontal Network Latitude Connector Bars -->
    <path d="M 80,138 L 152,138 M 86,76 L 158,76" stroke="#0B6375" stroke-width="4.5" stroke-linecap="round" opacity="0.65" />
    <!-- Network Node Circles -->
    <circle cx="156" cy="76" r="7.5" fill="url(#nmx_full_gold_l)" />
    <circle cx="80" cy="138" r="7.5" fill="#0A5E70" />
    <!-- Outer Left & Bottom Teal Globe Arc -->
    <path d="M 100,14 C 52,14 14,52 14,100 C 14,146 52,186 100,186 C 126,186 148,174 164,158" stroke="url(#nmx_full_teal_arc_l)" stroke-width="7.5" stroke-linecap="round" />
    <!-- Lower-Left Internal Meridian Arc -->
    <path d="M 100,186 C 68,186 38,152 38,106 C 38,76 50,46 72,28" stroke="url(#nmx_full_teal_arc_l)" stroke-width="6" stroke-linecap="round" opacity="0.75" />
    <!-- Leftmost Vertical Curved Pillar of 'N' -->
    <path d="M 44,156 C 32,136 26,112 26,90 C 26,64 36,44 54,30 C 57,28 61,31 60,35 C 50,52 46,74 46,96 C 46,120 52,140 64,156 C 66,160 61,164 56,162 C 51,161 47,158 44,156 Z" fill="url(#nmx_full_teal_l)" />
    <!-- Right Vertical Teardrop Pillar of 'N' -->
    <path d="M 124,58 C 144,58 162,80 162,112 C 162,142 144,168 126,170 C 122,170 120,165 122,161 C 134,142 142,120 142,98 C 142,78 132,64 120,60 C 118,59 120,58 124,58 Z" fill="url(#nmx_full_teal_pillar_l)" />
    <!-- Middle Sweeping Diagonal Ribbon -->
    <path d="M 50,38 C 68,20 94,20 114,38 L 160,138 C 166,152 154,168 136,168 C 124,168 114,156 106,140 L 64,54 C 56,38 48,38 50,38 Z" fill="url(#nmx_full_teal_l)" opacity="0.95" />
    <!-- Primary Foreground Diagonal Ribbon -->
    <path d="M 64,32 C 80,16 102,18 120,38 L 166,134 C 178,156 166,178 142,178 C 126,178 114,166 104,148 L 68,68 C 60,48 50,44 64,32 Z" fill="url(#nmx_full_gold_l)" />
    <!-- Gold Ribbon Inner Sheen -->
    <path d="M 76,38 C 88,26 104,28 118,44 L 158,132 C 166,148 156,164 140,164 C 130,164 120,154 112,138 L 78,64 C 72,50 68,44 76,38 Z" fill="#FFF6D8" opacity="0.4" />
    <!-- Bottom Loop Interlocking Under-Shadow -->
    <path d="M 104,148 C 114,166 126,178 142,178 C 146,178 150,176 154,172 C 142,174 130,166 120,148 L 104,148 Z" fill="#664610" opacity="0.5" />
  </g>

  <!-- 2. Typography Lockup (Light Theme) -->
  <g transform="translate(162, 88)">
    <text font-family="Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="58" letter-spacing="1.5" fill="#03303D">NOOR<tspan fill="url(#nmx_full_gold_l)">MEXA</tspan></text>
  </g>
  <g transform="translate(165, 122)">
    <text font-family="Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="23" letter-spacing="0.5" fill="#52667A">Global Smart Shopping</text>
  </g>
</svg>
