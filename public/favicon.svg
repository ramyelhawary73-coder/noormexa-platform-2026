<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="fav_globe_sphere" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#3B82F6" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#1E40AF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#172554" stop-opacity="1" />
    </radialGradient>

    <radialGradient id="fav_globe_rim" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#60A5FA" stop-opacity="0" />
      <stop offset="96%" stop-color="#0284C7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8" />
    </radialGradient>

    <linearGradient id="fav_n_left_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="fav_n_diagonal_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="fav_n_right_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <linearGradient id="fav_orbit_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <filter id="fav_ribbon_shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-2.5" dy="4" stdDeviation="3.5" flood-color="#020617" flood-opacity="0.5" />
    </filter>
  </defs>

  <g id="favicon-emblem">
    <!-- Globe Sphere -->
    <circle cx="90" cy="90" r="66" fill="url(#fav_globe_sphere)" />
    <circle cx="90" cy="90" r="66" fill="url(#fav_globe_rim)" />

    <!-- Gridlines -->
    <ellipse cx="90" cy="90" rx="66" ry="17" stroke="#60A5FA" stroke-width="1.8" stroke-opacity="0.5" fill="none" />
    <ellipse cx="90" cy="90" rx="22" ry="66" stroke="#38BDF8" stroke-width="1.8" stroke-opacity="0.45" fill="none" />

    <!-- Core 'N' -->
    <path
      d="M 44,38 
         C 53,38 58,43 58,52 
         L 58,128 
         C 58,137 53,142 44,142 
         C 39,142 35,136 35,128 
         L 35,52 
         C 35,44 39,38 44,38 Z"
      fill="url(#fav_n_left_grad)"
    />
    <path d="M 39,48 L 39,132" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.8" fill="none" />

    <path
      d="M 136,38 
         C 141,38 145,44 145,52 
         L 145,128 
         C 145,136 141,142 136,142 
         C 127,142 122,137 122,128 
         L 122,52 
         C 122,43 127,38 136,38 Z"
      fill="url(#fav_n_right_grad)"
    />
    <path d="M 141,48 L 141,132" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.8" fill="none" />

    <path
      d="M 37,40 
         C 47,35 57,39 64,48 
         L 142,132 
         C 147,138 143,145 135,145 
         C 125,145 117,140 109,130 
         L 36,52 
         C 32,46 32,42 37,40 Z"
      fill="url(#fav_n_diagonal_grad)"
      filter="url(#fav_ribbon_shadow)"
    />
    <path d="M 42,43 L 137,139" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.95" fill="none" />

    <!-- Orbit -->
    <path
      d="M 16,108 
         C 24,72 74,60 118,74 
         C 148,84 166,102 164,110 
         C 162,118 136,134 94,130 
         C 52,126 18,116 16,108 Z"
      stroke="url(#fav_orbit_grad)"
      stroke-width="3"
      fill="none"
    />

    <!-- Glowing Nodes -->
    <circle cx="44" cy="44" r="5.5" fill="#38BDF8" />
    <circle cx="44" cy="44" r="2.8" fill="#FFFFFF" />
    <circle cx="136" cy="136" r="5.5" fill="#F59E0B" />
    <circle cx="136" cy="136" r="2.8" fill="#FFFFFF" />
    <circle cx="140" cy="84" r="4.5" fill="#FBBF24" />
    <circle cx="140" cy="84" r="2.2" fill="#FFFFFF" />
    <circle cx="90" cy="90" r="4" fill="#FFFFFF" />
  </g>
</svg>
