<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fav_sphere_grad" x1="15%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#0d47a1" />
      <stop offset="26%" stop-color="#1565c0" />
      <stop offset="52%" stop-color="#1a6dd4" />
      <stop offset="78%" stop-color="#b8922e" />
      <stop offset="100%" stop-color="#e6c15a" />
    </linearGradient>

    <radialGradient id="fav_highlight_grad" cx="32%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </radialGradient>

    <linearGradient id="fav_gold_ribbon" x1="20%" y1="15%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FCEAB2" />
      <stop offset="35%" stop-color="#E5C15E" />
      <stop offset="70%" stop-color="#C29738" />
      <stop offset="100%" stop-color="#916817" />
    </linearGradient>

    <linearGradient id="fav_blue_ribbon" x1="10%" y1="10%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#54A5FF" />
      <stop offset="40%" stop-color="#1E7BE8" />
      <stop offset="75%" stop-color="#125BB5" />
      <stop offset="100%" stop-color="#083677" />
    </linearGradient>

    <clipPath id="fav_clip">
      <circle cx="80" cy="80" r="68" />
    </clipPath>
  </defs>

  <g id="favicon-emblem">
    <!-- 3D Sphere Base -->
    <circle cx="80" cy="80" r="68" fill="url(#fav_sphere_grad)" />
    <!-- Spherical Ambient Highlight -->
    <circle cx="80" cy="80" r="68" fill="url(#fav_highlight_grad)" />

    <!-- Clipped 'N' & Globe Arcs -->
    <g clip-path="url(#fav_clip)">
      <path d="M 12,80 Q 80,60 148,80" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5" fill="none" />
      <path d="M 20,50 Q 80,32 140,50" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5" fill="none" />
      <path d="M 20,110 Q 80,128 140,110" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5" fill="none" />

      <!-- Left Pillar -->
      <path
        d="M 38,32 C 28,48 24,66 24,84 C 24,102 30,118 40,130 C 44,135 52,132 52,125 C 45,114 40,100 40,84 C 40,67 45,53 52,40 C 53,34 46,28 38,32 Z"
        fill="url(#fav_blue_ribbon)"
      />
      <!-- Right Pillar -->
      <path
        d="M 110,32 C 117,46 122,64 122,82 C 122,100 117,116 110,130 C 108,135 114,140 120,135 C 130,121 136,103 136,82 C 136,62 129,44 119,30 C 113,26 108,29 110,32 Z"
        fill="url(#fav_gold_ribbon)"
      />

      <!-- Diagonal Swoop -->
      <path
        d="M 38,32 C 50,26 66,34 78,50 L 126,120 C 132,130 128,138 116,138 C 107,138 98,128 88,114 L 42,44 C 36,36 34,33 38,32 Z"
        fill="url(#fav_gold_ribbon)"
      />
      <path
        d="M 40,32 L 124,120"
        stroke="#FFFFFF"
        stroke-opacity="0.3"
        stroke-width="1.5"
        stroke-linecap="round"
        fill="none"
      />
    </g>

    <circle cx="80" cy="80" r="68" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" fill="none" />
  </g>
</svg>
