name: NOORMEXA Premium Product Editor P0

on:
  pull_request:
    branches: [main]
    paths:
      - src/components/seller/ProductEditorModal.tsx
      - src/components/SmartImageUploadField.tsx
      - src/lib/productEditorRules.ts
      - src/lib/marketplace.ts
      - src/app/seller/dashboard/page.tsx
      - scripts/test-premium-product-editor.mjs
      - .github/workflows/noormexa-premium-product-editor.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Real TS validation rules tests
        run: node scripts/test-premium-product-editor.mjs
      - name: TypeScript
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit
      - name: Full ESLint
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Next build
        if: ${{ !cancelled() }}
        run: npm run build
